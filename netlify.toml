[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "vite"
  port = 8888
  targetPort = 5173

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[functions."blob-upload"]
  timeout = 26

[functions."blob-delete"]
  timeout = 10

[functions."cleanup-blobs"]
  timeout = 300

[functions."upload-documents"]
  timeout = 26

[functions."regenerate-document-summary"]
  timeout = 60

[functions."summarize-chat-session"]
  timeout = 60

[functions."accept-regenerated-summary"]
  timeout = 10

[functions."index-cfr-regulations"]
  timeout = 60

[functions."scrape-web-resources"]
  timeout = 60

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/*"
  to   = "/.netlify/functions/:splat"
  status = 200

# Security headers to prevent clickjacking, XSS, and MIME-sniffing
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.auth0.com https://*.auth0.com.au; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Scheduled cleanup: daily at 02:00 UTC
[[scheduled]]
  cron = "0 2 * * *"
  path = "/.netlify/functions/cleanup-blobs"
