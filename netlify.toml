[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"
  # Increase timeout for AI-heavy operations (max 26s on Pro, 10s on free tier)
  # If on Pro plan, you can set this to 26
  timeout = 26

[[redirects]]
  from = "/api/*"
  to   = "/.netlify/functions/:splat"
  status = 200
