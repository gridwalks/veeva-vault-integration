[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[functions."blob-upload"]
  timeout = 26

[functions."blob-delete"]
  timeout = 10

[functions."cleanup-blobs"]
  timeout = 300

[functions."upload-documents"]
  timeout = 26

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/*"
  to   = "/.netlify/functions/:splat"
  status = 200

# Scheduled cleanup: daily at 02:00 UTC
[[scheduled]]
  cron = "0 2 * * *"
  path = "/.netlify/functions/cleanup-blobs"
